[package]
name = "perse_egui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "perse_egui"
path = "src/main.rs"

[features]
default = ["viewer"]
viewer = [
    "dep:eframe",
    "dep:egui",
    "dep:re_ui",
    "dep:re_uri",
    "dep:re_chunk_store",
    "dep:re_log_types",
    "dep:re_sdk_types",
    "dep:re_viewer_context",
    "dep:re_viewer",
    "dep:rewire-viewer",
    "dep:egui-file-dialog",
    "dep:mimalloc",
    "dep:re_memory",
    "dep:re_crash_handler",
    "dep:re_grpc_server",
]

[dependencies]
re_log = { version = "0.38", features = ["setup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }

# Opcionais (apenas quando feature viewer estiver ativa)
eframe = { version = "0.36", features = ["persistence"], optional = true }
egui = { version = "0.36", optional = true }
re_ui = { version = "0.38", optional = true }
re_uri = { version = "0.38", optional = true }
re_chunk_store = { version = "0.38", optional = true }
re_log_types = { version = "0.38", optional = true }
re_sdk_types = { version = "0.38", optional = true }
re_viewer_context = { version = "0.38", optional = true }
re_viewer = { version = "0.38", default-features = false, optional = true }
rewire-viewer = { package = "rewire-viewer", path = "external/rewire-viewer", default-features = false, optional = true }
egui-file-dialog = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rewire-viewer = { package = "rewire-viewer", path = "external/rewire-viewer", features = ["native"], optional = true }
mimalloc = { version = "0.1", optional = true }
re_memory = { version = "0.38", optional = true }
re_crash_handler = { version = "0.38", optional = true }
re_grpc_server = { version = "0.38", optional = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement", "Window", "DomException", "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "BinaryType"] }

# Otimizações de compilação em desenvolvimento
[profile.dev]
debug = 1 # Reduz enormemente o tamanho dos arquivos de símbolos e acelera a linkagem

# Otimizar apenas dependências que afetam o desempenho gráfico da UI em modo debug
[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.re_renderer]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
