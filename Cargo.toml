[package]
name = "perse_egui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
mimalloc = "0.1"
re_crash_handler = "0.38"
re_grpc_server = "0.38"
re_log = "0.38"
re_memory = "0.38"
re_ui = "0.38"
re_uri = "0.38"
re_viewer = { version = "0.38", default-features = false }
rewire-viewer = { package = "rewire-viewer", path = "external/rewire-viewer" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Otimizações de compilação em desenvolvimento
[profile.dev]
debug = 1 # Reduz enormemente o tamanho dos arquivos de símbolos e acelera a linkagem

[profile.dev.package."*"]
opt-level = 1 # Mantém dependências pesadas pré-otimizadas
