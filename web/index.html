<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Perse Egui</title>
  <meta name="description" content="Rewire viewer based on Rerun API for bridge introspection" />
  <link rel="icon" href="https://rewire.run/rewire-icon.png" />
  <link rel="apple-touch-icon" href="https://rewire.run/rewire-icon.png" />
  <meta property="og:title" content="Perse Egui" />
  <meta property="og:description" content="Rewire viewer based on Rerun API for bridge introspection" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://app.rewire.run" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      color: #ccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    #loading h2 { margin-bottom: 8px; }
    #loading .progress {
      width: 300px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading .progress-bar {
      height: 100%;
      background: #003DA1;
      width: 0%;
      transition: width 0.2s;
    }
    #the_canvas_id {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .hidden { display: none !important; }
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #e44;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h2>Rewire Viewer</h2>
    <p id="status">Loading...</p>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </div>
  <canvas id="the_canvas_id" class="hidden"></canvas>
  <div id="error" class="hidden"></div>
  <script>
    let _perseTerminalFocused = false;
    Object.defineProperty(window, "__perse_terminal_focused", {
      get() {
        return _perseTerminalFocused;
      },
      set(val) {
        _perseTerminalFocused = Boolean(val);
        // Tenta acionar a Keyboard Lock API (Chromium / Edge) para teclas de sistema como Ctrl+W e Ctrl+R
        if (_perseTerminalFocused) {
          if (navigator.keyboard && typeof navigator.keyboard.lock === "function") {
            navigator.keyboard.lock(["KeyW", "KeyR"]).catch(() => {});
          }
        } else {
          if (navigator.keyboard && typeof navigator.keyboard.unlock === "function") {
            navigator.keyboard.unlock();
          }
        }
      },
      configurable: true,
      enumerable: true,
    });

    // Rede de segurança: impede fechamento acidental de aba se o navegador tentar fechar via Ctrl+W
    window.addEventListener("beforeunload", (e) => {
      if (window.__perse_terminal_focused) {
        e.preventDefault();
        e.returnValue = "";
        return "";
      }
    });

    // Quando o terminal estiver em foco, engole atalhos do navegador para que não recarreguem a página
    // nem fechem a aba ou executem ações padrão (Ctrl+R, Cmd+R, F5, Ctrl+W, Ctrl+F, Ctrl+S, Tab, etc.)
    window.addEventListener("keydown", (e) => {
      if (window.__perse_terminal_focused) {
        // Permitir atalhos de ferramentas de desenvolvedor: F12 e Ctrl+Shift+I / J / C
        if (e.key === "F12" || (e.ctrlKey && e.shiftKey && ["I", "i", "J", "j", "C", "c"].includes(e.key))) {
          return;
        }

        // Permitir Ctrl+V / Cmd+V para que o evento nativo de colagem (paste) alcance a aplicação
        if ((e.ctrlKey || e.metaKey) && (e.key === "v" || e.key === "V")) {
          return;
        }

        // Se estiver compondo texto (IME) ou for tecla morta (acentos como ~, ^, ´, `),
        // NUNCA previna o default para que a engine nativa de composição funcione com o text_agent!
        if (e.isComposing || e.key === "Dead") {
          return;
        }

        // Se for caractere imprimível comum (incluindo combinações AltGr), deixe ir para o text_agent do eframe
        if (!e.metaKey && (!e.ctrlKey || e.altKey) && e.key.length === 1) {
          return;
        }

        // Engole atalhos de controle (Ctrl+R, Ctrl+W, Ctrl+F, Ctrl+S, etc.), navegação por Alt (Alt+Left/Right),
        // F5, Tab e scroll no canvas, impedindo as ações nativas do navegador
        e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && (e.key === "w" || e.key === "W" || e.code === "KeyW")) {
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }
    }, { capture: true });

    window.addEventListener("blur", () => {
      window.__perse_terminal_focused = false;
    });
  </script>

  <script type="module">
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progress-bar");
    const canvas = document.getElementById("the_canvas_id");
    const errorDiv = document.getElementById("error");

    async function main() {
      try {
        status.textContent = "Loading module...";

        // Fetch and patch the JS glue to replace bare "env" import with inline shim
        const jsResponse = await fetch("./rewire_viewer.js", { cache: "force-cache" });
        let jsText = await jsResponse.text();
        jsText = jsText.replace(
          /import \* as (\w+) from ['"]env['"];?/,
          (_, varName) => `const ${varName} = new Proxy({}, { get(_, prop) { return () => 0; } });`
        );
        const blob = new Blob([jsText], { type: "application/javascript" });
        const blobUrl = URL.createObjectURL(blob);
        const module = await import(blobUrl);
        URL.revokeObjectURL(blobUrl);
        const init = module.default;
        const PerseWebHandle = module.PerseWebHandle || module.RewireWebHandle;

        status.textContent = "Loading viewer...";
        const wasmResponse = await fetch("./rewire_viewer_bg.wasm", { cache: "force-cache" });
        const contentLength = wasmResponse.headers.get("content-length");
        const total = contentLength ? parseInt(contentLength, 10) : 0;
        let loaded = 0;

        const reader = wasmResponse.body.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          if (total > 0) {
            const pct = Math.round((loaded / total) * 100);
            progressBar.style.width = pct + "%";
            status.textContent = `Loading viewer... ${pct}%`;
          }
        }

        const wasmBytes = new Uint8Array(await new Blob(chunks).arrayBuffer());

        status.textContent = "Initializing...";
        progressBar.style.width = "100%";
        await init(wasmBytes);

        const handle = new PerseWebHandle();
        const params = new URLSearchParams(window.location.search);
        const rrdUrl = params.get("url") || `rerun+http://${window.location.hostname || "127.0.0.1"}:9876/proxy`;
        // `?theme=dark|light|system`. Without it the viewer follows the
        // browser's prefers-color-scheme, which an embedding page cannot
        // influence: `color-scheme` does not cross an origin boundary, and the
        // UI is painted into a canvas rather than out of browser widgets.
        const theme = params.get("theme") || undefined;
        await handle.start(canvas, rrdUrl, theme);

        // Let a host page follow its own theme toggle without reloading the
        // iframe — a reload would re-download the recording:
        //   frame.contentWindow.postMessage({ type: "rewire:theme", theme: "light" }, "*")
        // Cosmetic and idempotent, so any origin may send it; the viewer
        // ignores values other than dark/light/system.
        window.addEventListener("message", (event) => {
          const data = event.data;
          if (data && data.type === "rewire:theme" && typeof data.theme === "string") {
            handle.set_theme(data.theme);
          }
        });

        loading.classList.add("hidden");
        canvas.classList.remove("hidden");

        function checkPanic() {
          if (handle.has_panicked()) {
            errorDiv.textContent = "Viewer crashed: " + (handle.panic_message() || "unknown error");
            errorDiv.classList.remove("hidden");
            canvas.classList.add("hidden");
          } else {
            requestAnimationFrame(checkPanic);
          }
        }
        checkPanic();
      } catch (e) {
        console.error(e);
        errorDiv.textContent = "Failed to load viewer: " + e;
        errorDiv.classList.remove("hidden");
        loading.classList.add("hidden");
      }
    }

    main();
  </script>
</body>
</html>
