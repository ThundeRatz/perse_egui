name: CI & Release Assets

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold libclang-dev pkg-config libx11-dev libasound2-dev libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  build-web:
    name: Build WebAssembly (web/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          cargo install -f wasm-bindgen-cli --version 0.2.126

      - name: Build Web Assets
        run: |
          chmod +x ./build_web.sh
          ./build_web.sh

      - name: Package Web Assets
        run: |
          tar -czvf perse_egui-web.tar.gz web/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: perse_egui-web
          path: perse_egui-web.tar.gz

  build-release-binaries:
    name: Build Release (${{ matrix.target }})
    needs: check-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: perse_egui-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            asset_name: perse_egui-aarch64
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (x86_64)
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold libclang-dev pkg-config libx11-dev libasound2-dev libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for aarch64 cross-compilation)
        if: ${{ matrix.use_cross }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build Binary (Native x86_64)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/perse_egui ${{ matrix.asset_name }}

      - name: Build Binary (Cross aarch64)
        if: ${{ matrix.use_cross }}
        run: |
          cross build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/perse_egui ${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-release-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: perse_egui-web

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: perse_egui-x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: perse_egui-aarch64

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            perse_egui-x86_64
            perse_egui-aarch64
            perse_egui-web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
